services:
  envio-postgres:
    image: postgres:17.5
    restart: always
    # Tidak ada ports: Postgres hanya bisa diakses dari network internal
    volumes:
      - envio-indexer-storage:/var/lib/postgresql/data
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:?ENVIO_PG_PASSWORD wajib diisi}
      POSTGRES_USER: ${ENVIO_PG_USER:-postgres}
      POSTGRES_DB: ${ENVIO_PG_DATABASE:-envio-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENVIO_PG_USER:-postgres} -d ${ENVIO_PG_DATABASE:-envio-dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - envio-indexer-network

  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    # Tidak ada ports: akses publik hanya lewat Traefik
    user: 1001:1001
    depends_on:
      envio-postgres:
        condition: service_healthy
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD}@envio-postgres:5432/${ENVIO_PG_DATABASE:-envio-dev}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_NO_OF_RETRIES: 10
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?HASURA_GRAPHQL_ADMIN_SECRET wajib diisi}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      PORT: 8080
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 5s
    labels:
      - traefik.enable=true
      # Wajib karena container ada di 2 network
      - traefik.docker.network=dokploy-network
      # HTTPS
      - traefik.http.routers.hasura-custos.rule=Host(`hasura-custos.alwaysbedream.dev`)
      - traefik.http.routers.hasura-custos.entrypoints=websecure
      - traefik.http.routers.hasura-custos.tls.certresolver=letsencrypt
      - traefik.http.routers.hasura-custos.service=hasura-custos
      # HTTP -> HTTPS redirect
      - traefik.http.routers.hasura-custos-http.rule=Host(`hasura-custos.alwaysbedream.dev`)
      - traefik.http.routers.hasura-custos-http.entrypoints=web
      - traefik.http.routers.hasura-custos-http.middlewares=redirect-to-https@file
      - traefik.http.routers.hasura-custos-http.service=hasura-custos
      # Upstream
      - traefik.http.services.hasura-custos.loadbalancer.server.port=8080
    networks:
      - envio-indexer-network
      - dokploy-network

  envio-indexer:
    container_name: envio-indexer
    build:
      context: .
      dockerfile: Dockerfile
    # Tidak ada ports: indexer hanya internal
    depends_on:
      graphql-engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 800M
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD}
      ENVIO_PG_HOST: envio-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: ${ENVIO_PG_USER:-postgres}
      ENVIO_PG_DATABASE: ${ENVIO_PG_DATABASE:-envio-dev}
      ENVIO_PG_PUBLIC_SCHEMA: ${ENVIO_PG_PUBLIC_SCHEMA:-envio}
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_INDEXER_PORT: ${ENVIO_INDEXER_PORT:-9898}
      CONFIG_FILE: ${CONFIG_FILE:-config.yaml}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_STRATEGY: ${LOG_STRATEGY:-console-pretty}
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_SERVICE_HOST: graphql-engine
      HASURA_SERVICE_PORT: 8080
      TUI_OFF: ${TUI_OFF:-true}
    healthcheck:
      # Sebelumnya cek port 8080 (port Hasura), seharusnya port indexer
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/${ENVIO_INDEXER_PORT:-9898}' || exit 1
      interval: 5s
      timeout: 2s
      retries: 50
      start_period: 5s
    networks:
      - envio-indexer-network

volumes:
  envio-indexer-storage:

networks:
  envio-indexer-network:
  dokploy-network:
    external: true