# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: envio-indexer
disable_default_cross_chain: true
# Event/handler definitions are shared across chains; each chain lists only addresses.
contracts:
- name: CustosCore
  events:
  - event: AgentAllowanceChanged(bytes32 indexed id, uint128 oldAllowance, uint128 newAllowance)
  - event: AgentPeriodChanged(bytes32 indexed id, uint32 oldPeriodLength, uint32 newPeriodLength)
  - event: AgentPublicChanged(bytes32 indexed id, bool isPublic)
  - event: AgentRegistered(bytes32 indexed id, address indexed creator, address indexed wallet, address vault, bytes32 name, string description, uint128 allowance, uint32 periodLength, uint16 feeRate, bool isPublic)
  - event: AgentStatusChanged(bytes32 indexed id, uint8 oldStatus, uint8 newStatus)
  - event: Initialized(uint64 version)
  - event: MarketAdapterChanged(address indexed oldAdapter, address indexed newAdapter)
  - event: MarketAllowedChanged(address indexed market, bool allowed)
  - event: MinSeedChanged(uint128 oldMinSeed, uint128 newMinSeed)
  - event: PausedChanged(bool paused)
  - event: Upgraded(address indexed implementation)
# NanSigil (repo nansigil-contract): wallet-keyed reputation attestations.
- name: NanSigil
  events:
  - event: AttestorChanged(address indexed oldAttestor, address indexed newAttestor)
  - event: AttestationSubmitted(address indexed wallet, string label, int256 pnl, uint16 winRate, uint64 timestamp, bytes32 attestHash)
  - event: Upgraded(address indexed implementation)
- name: AgentVault
  # No fixed address — one AgentVault is deployed per agent via
  # CustosCore.registerAgent, so there's no single address to list. Instances
  # are registered dynamically from CustosCore's AgentRegistered event; see
  # the indexer.contractRegister call in src/handlers/CustosCore.ts.
  events:
  - event: SwapExecuted(address indexed vault, bytes32 indexed agentId, address indexed market, bool isBuy, uint128 baseAmount, uint128 quoteAmount, uint128 notionalCharged, uint256 newTotalAssets, uint256 newSharePrice)
  - event: SubscriberDeposited(address indexed vault, address indexed subscriber, uint256 assets, uint256 shares)
  - event: SubscriberRedeemed(address indexed vault, address indexed subscriber, uint256 assets, uint256 shares)
  - event: SeedDeposited(address indexed vault, address indexed creator, uint256 assets, uint256 shares, address deadAddress)
  - event: FeeMinted(address indexed vault, address indexed creator, uint256 feeShares, uint256 feeAssets, uint256 newHighWaterMark)
  - event: CircuitBreakerTriggered(address indexed vault, uint256 currentSharePrice, uint256 highWaterMark, uint16 maxDrawdownBps)
  - event: Transfer(address indexed from, address indexed to, uint256 value)

chains:
# Monad testnet
- id: 10143
  start_block: 0
  contracts:
  - name: CustosCore
    address:
    - "0xCfBbd07b107A6cb7e685e555E4C9ef956d11a0bB"
  - name: NanSigil
    # TODO: placeholder until NanSigil is deployed on testnet; replace with .nansigil
    # from deployments/*.json. Also what test/derived.test.ts simulates against.
    address:
    - "0x2222222222222222222222222222222222222222"
  - name: AgentVault # registered dynamically from AgentRegistered

# Monad mainnet. Addresses from custos-contract/deployments/monad.json; the start
# block is the deployment block of CustosCore, so nothing earlier is scanned.
- id: 143
  start_block: 107876400
  contracts:
  - name: CustosCore
    address:
    - "0x8809926996F45505F17599fda8299d86bA3586af"
  - name: NanSigil
    address:
    - "0x1421E6Acc7C7b3199077CD3b2A7d2A33778dfe9D"
  - name: AgentVault # registered dynamically from AgentRegistered
