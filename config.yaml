# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: envio-indexer
disable_default_cross_chain: true
# Event and handler definitions are shared across chains; each chain lists only
# addresses. Each contract names its events and reads their signatures from the
# ABI that `make abi` generates in the contract repo, so a signature cannot drift
# from the deployed contract without codegen failing here.
contracts:
- name: CustosCore
  abi_file_path: abis/CustosCore.json
  events:
  - event: AgentAllowanceChanged
  - event: AgentPeriodChanged
  - event: AgentPublicChanged
  - event: AgentRegistered
  - event: AgentStatusChanged
  - event: Initialized
  - event: MarketAdapterChanged
  - event: MarketAllowedChanged
  - event: MinSeedChanged
  - event: PausedChanged
  - event: Upgraded
# NanSigil (repo nansigil-contract): wallet-keyed reputation attestations.
- name: NanSigil
  abi_file_path: abis/NanSigil.json
  events:
  - event: AttestorChanged
  - event: AttestationSubmitted
  - event: Upgraded
- name: AgentVault
  # No fixed address — one AgentVault is deployed per agent via
  # CustosCore.registerAgent, so there's no single address to list. Instances
  # are registered dynamically from CustosCore's AgentRegistered event; see
  # the indexer.contractRegister call in src/handlers/CustosCore.ts.
  abi_file_path: abis/AgentVault.json
  events:
  - event: SwapExecuted
  - event: SubscriberDeposited
  - event: SubscriberRedeemed
  - event: SeedDeposited
  - event: FeeMinted
  - event: CircuitBreakerTriggered
  - event: Transfer

chains:
# Monad testnet
- id: 10143
  start_block: 0
  contracts:
  - name: CustosCore
    address:
    - "0xCfBbd07b107A6cb7e685e555E4C9ef956d11a0bB"
  - name: NanSigil
    # TODO: placeholder until NanSigil is deployed on testnet; replace with .nansigil
    # from deployments/*.json. Also what test/derived.test.ts simulates against.
    address:
    - "0x2222222222222222222222222222222222222222"
  - name: AgentVault # registered dynamically from AgentRegistered

# Monad mainnet. Addresses from custos-contract/deployments/monad.json; the start
# block is the deployment block of CustosCore, so nothing earlier is scanned.
- id: 143
  start_block: 107876400
  contracts:
  - name: CustosCore
    address:
    - "0x8809926996F45505F17599fda8299d86bA3586af"
  - name: NanSigil
    address:
    - "0x1421E6Acc7C7b3199077CD3b2A7d2A33778dfe9D"
  - name: AgentVault # registered dynamically from AgentRegistered
