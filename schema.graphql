# ---------------------------------------------------------------------------
# Derived entities (one row per agent, one row per price observation) — what
# the marketplace reads. The raw per-event entities above stay as the audit log.
# ---------------------------------------------------------------------------

# id = agentId (lowercased). Entities are per-chain in envio (it adds and
# scopes `chainId` itself), so the same agentId on testnet and mainnet never collide.
type Agent {
  id: ID!
  creator: String! @index
  wallet: String!
  vault: String! @index
  name: String!
  description: String!
  allowance: BigInt!
  periodLength: BigInt!
  feeRate: BigInt!
  isPublic: Boolean!
  # Mirrors Types.Status: 1 Active, 2 Paused, 3 Revoked. CircuitBreakerTriggered
  # sets 2 without a registry event, so this is the union of both sources.
  status: Int!
  registeredAt: Int! @index
  # Event-derived running totals; see src/handlers/AgentVault.ts.
  totalAssets: BigInt!
  subscriberCount: Int!
  yieldDeployed: BigInt!
  realizedPnl: BigInt!
  closedCount: Int!
  winCount: Int!
  baseBalance: BigInt!
  baseCostBasis: BigInt!
  # Lifetime capital in (subscriber and seed deposits) and out (redemptions); only grow.
  assetsInTotal: BigInt!
  assetsOutTotal: BigInt!
  # Distinct lowercased markets this agent has swapped on.
  markets: [String!]!
  # Last observed share price, 1e18-scaled, and when.
  sharePrice: BigInt!
  lastPriceAt: Int!
  swapCount: Int!
  buyCount: Int!
  # Largest single swap quoteAmount.
  maxNotional: BigInt!
  # Swap counts by UTC hour of day, always 24 long.
  tradeHours: [Int!]!
  # Hold-time state: weighted entry-time sum of the open balance, and total seconds held by closed sells.
  baseTimeCost: BigInt!
  holdSecondsTotal: BigInt!
  breakerCount: Int!
  # Sum of notionalCharged over every swap, in USDC units.
  volume: BigInt!
  # Latest NanSigil attestation of the creator wallet (the event carries the
  # plaintext), enough to call NanSigil.verify. Null until the first submission.
  nansenLabel: String
  nansenPnl: BigInt
  nansenWinRate: Int
  nansenAttestedAt: Int
}

# id = `${chainId}_${blockNumber}_${logIndex}`; one per event that reports a
# share price (SeedDeposited at 1e18, SwapExecuted, CircuitBreakerTriggered).
type SharePricePoint {
  id: ID!
  agent: String! @index
  timestamp: Int!
  sharePrice: BigInt!
  totalAssets: BigInt!
  # notionalCharged for a swap point, 0 otherwise — lets a 30d volume be summed client-side.
  notional: BigInt!
  source: String!
}

# Vault events other than SwapExecuted carry only the vault address.
# id = vault address (lowercased) -> Agent.id.
type VaultRef {
  id: ID!
  agent: String!
}

# id = `${vault}_${holder}`, both lowercased. shares follows the vault's ERC-20
# Transfer events; assetsIn/assetsOut sum deposits and redemptions.
type VaultPosition {
  id: ID!
  vault: String! @index
  agent: String! @index
  holder: String! @index
  shares: BigInt!
  assetsIn: BigInt!
  assetsOut: BigInt!
  firstSeenAt: Int!
  lastActivityAt: Int!
}

# id = market address (lowercased).
type Market {
  id: ID!
  baseToken: String!
  baseSymbol: String!
  baseDecimals: Int!
}

# id = `${chainId}_${agent}_${hourStart}`.
type AgentSnapshot {
  id: ID!
  agent: String! @index
  timestamp: Int!
  sharePrice: BigInt!
  totalAssets: BigInt!
  subscriberCount: Int!
}

# id = `${chainId}_${market}_${hourStart}`, market lowercased. Readers sum buckets
# for rolling windows; net flow is buyNotional - sellNotional.
type MarketFlowBucket {
  id: ID!
  market: String! @index
  timestamp: Int! @index
  buyNotional: BigInt!
  sellNotional: BigInt!
  swapCount: Int!
}
